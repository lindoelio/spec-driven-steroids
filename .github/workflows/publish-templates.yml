name: Publish Templates

# The template bundle is published as part of the unified release in
# publish.yml. This workflow republishes it on demand, for example after the
# canonical tree changed without a version bump. It no longer reacts to the
# release tag, so one release publishes the bundle once.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Template channel to publish (templates-next for the native preview, templates-latest for stable)'
        required: false
        default: 'templates-next'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish-templates:
    name: Publish the template bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Guard the stable channel
        run: |
          set -euo pipefail
          CHANNEL="${{ inputs.channel }}"
          if [ "${CHANNEL}" = "templates-latest" ]; then
            echo "::warning::Republishing templates-latest overwrites the bundle the stable TypeScript CLI resolves. Only use this for the stable native release."
          fi

      - name: Build template bundle assets
        env:
          TEMPLATE_CHANNEL: ${{ inputs.channel }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          // The bundle version derives from the declared version, which is
          // declared once in the VERSION file at the repository root.
          const version = fs.readFileSync('VERSION', 'utf8').trim();
          const channel = process.env.TEMPLATE_CHANNEL || 'templates-next';
          const canonicalRoot = path.join('internal', 'assets', 'canonical');
          const outputDir = '.template-release';

          function walk(directory, prefix) {
            const files = {};
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const absolute = path.join(directory, entry.name);
              const relative = path.posix.join(prefix, entry.name);
              if (entry.isDirectory()) {
                Object.assign(files, walk(absolute, relative));
                continue;
              }
              files[relative] = fs.readFileSync(absolute, 'utf8');
            }
            return files;
          }

          const bundle = {
            schemaVersion: 1,
            version,
            files: walk(canonicalRoot, 'universal')
          };
          const bundleText = JSON.stringify(bundle, null, 2);
          const sha256 = crypto.createHash('sha256').update(bundleText, 'utf8').digest('hex');
          const manifest = {
            schemaVersion: 1,
            version,
            bundleUrl: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/download/' + channel + '/templates-bundle.json',
            sha256,
            minCliVersion: version,
            publishedAt: new Date().toISOString()
          };

          fs.rmSync(outputDir, { recursive: true, force: true });
          fs.mkdirSync(outputDir, { recursive: true });
          fs.writeFileSync(path.join(outputDir, 'templates-manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          fs.writeFileSync(path.join(outputDir, 'templates-bundle.json'), bundleText);
          NODE

      - name: Publish template release assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.channel }}
          name: ${{ inputs.channel }}
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          artifacts: .template-release/templates-manifest.json,.template-release/templates-bundle.json
          body: Published template bundle for runtime injection.
