name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go toolchain is pinned: the module declares the same version in go.mod.
  GO_VERSION: '1.27.3'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the module
        run: go build ./...

      - name: Build the release binary
        run: node scripts/build-go.mjs

      - name: Check the stamped version
        run: |
          DECLARED_VERSION="$(tr -d '[:space:]' < VERSION)"
          BINARY_VERSION="$(./dist/sds --version)"
          if [ "$BINARY_VERSION" != "$DECLARED_VERSION" ]; then
            echo "The binary reports $BINARY_VERSION, but the declared version is $DECLARED_VERSION" >&2
            exit 1
          fi
          # A sentinel proves that the version of the binary comes from the
          # stamp and not from the copy embedded in the source, which would
          # make the check above pass without a stamp at all.
          go build -trimpath \
            -ldflags "-X github.com/lindoelio/spec-driven-steroids/internal/version.Version=0.0.0-stamp" \
            -o "${RUNNER_TEMP}/sds-stamp" ./cmd/sds
          if [ "$("${RUNNER_TEMP}/sds-stamp" --version)" != "0.0.0-stamp" ]; then
            echo "The stamp does not reach the binary." >&2
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run the test suite
        run: go test ./...

  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run the test suite
        run: go test ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run the static checks
        run: go vet ./...

      - name: Check the formatting
        run: |
          UNFORMATTED="$(gofmt -l cmd internal)"
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not formatted:" >&2
            echo "$UNFORMATTED" >&2
            exit 1
          fi

  cross-compile:
    name: Cross compile ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The supported operating system and architecture pairs. The Go names
        # are the build targets; the npm names are the platform package names
        # the registry resolves, which use npm's own vocabulary.
        include:
          - goos: linux
            goarch: amd64
            platform: linux-x64
            asset: sds-linux-amd64
          - goos: linux
            goarch: arm64
            platform: linux-arm64
            asset: sds-linux-arm64
          - goos: darwin
            goarch: amd64
            platform: darwin-x64
            asset: sds-darwin-amd64
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
            asset: sds-darwin-arm64
          - goos: windows
            goarch: amd64
            platform: win32-x64
            asset: sds-windows-amd64.exe
          - goos: windows
            goarch: arm64
            platform: win32-arm64
            asset: sds-windows-arm64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cross compile ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          DECLARED_VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/lindoelio/spec-driven-steroids/internal/version.Version=${DECLARED_VERSION}" \
            -o "dist/${{ matrix.asset }}" \
            ./cmd/sds

  smoke:
    name: Packaged artifact smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the release binary
        run: node scripts/build-go.mjs

      - name: Run the built binary
        run: |
          DECLARED_VERSION="$(tr -d '[:space:]' < VERSION)"
          BINARY_VERSION="$(./dist/sds --version)"
          if [ "$BINARY_VERSION" != "$DECLARED_VERSION" ]; then
            echo "The binary reports $BINARY_VERSION, but the declared version is $DECLARED_VERSION" >&2
            exit 1
          fi
          ./dist/sds --help > /dev/null

      - name: Package smoke test
        run: node scripts/pack-check.mjs

  # The release ships binaries for macOS and Windows, and the Homebrew tap
  # serves macOS first. The cross compilation proves that they build, but
  # only running them proves that they work on the platform they serve.
  smoke-darwin:
    name: Darwin smoke check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        runner:
          - macos-latest
          - macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the release binary
        run: node scripts/build-go.mjs

      - name: Run the built binary
        run: |
          set -euo pipefail
          DECLARED_VERSION="$(tr -d '[:space:]' < VERSION)"
          BINARY_VERSION="$(./dist/sds --version)"
          if [ "$BINARY_VERSION" != "$DECLARED_VERSION" ]; then
            echo "The binary reports $BINARY_VERSION, but the declared version is $DECLARED_VERSION" >&2
            exit 1
          fi
          ./dist/sds --help > /dev/null

      - name: Inject and clean on the platform
        run: |
          set -euo pipefail
          BINARY="$(pwd)/dist/sds"
          WORK="$(mktemp -d)"
          cd "$WORK"
          "$BINARY" inject --platform claudecode --scope project --yes --templates bundled
          INJECTED="$(find . -type f | wc -l | tr -d ' ')"
          if [ "$INJECTED" = "0" ]; then
            echo "The injection wrote no file." >&2
            exit 1
          fi
          "$BINARY" doctor
          "$BINARY" clean --project --platform claudecode --yes
          "$BINARY" clean --project --yes
          LEFT="$(find . -type f | wc -l | tr -d ' ')"
          if [ "$LEFT" != "0" ]; then
            echo "The cleanup left $LEFT file(s) behind." >&2
            exit 1
          fi

  smoke-windows:
    name: Windows smoke check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the release binary
        run: node scripts/build-go.mjs

      - name: Run the built binary
        shell: pwsh
        run: |
          $declared = (Get-Content VERSION -Raw).Trim()
          $binary = (.\dist\sds.exe --version).Trim()
          if ($binary -ne $declared) {
            throw "The binary reports $binary, but the declared version is $declared"
          }
          .\dist\sds.exe --help | Out-Null

      - name: Inject and clean on the platform
        shell: pwsh
        run: |
          $binary = Join-Path (Get-Location) 'dist\sds.exe'
          $work = Join-Path ([System.IO.Path]::GetTempPath()) ("sds-" + [System.Guid]::NewGuid())
          New-Item -ItemType Directory -Path $work | Out-Null
          Push-Location $work
          try {
            & $binary inject --platform claudecode --scope project --yes --templates bundled
            if ($LASTEXITCODE -ne 0) { throw "the injection failed with $LASTEXITCODE" }
            $injected = @(Get-ChildItem -Path $work -Recurse -File).Count
            if ($injected -eq 0) { throw "the injection wrote no file" }
            & $binary doctor
            if ($LASTEXITCODE -ne 0) { throw "the doctor failed with $LASTEXITCODE" }
            & $binary clean --project --platform claudecode --yes
            if ($LASTEXITCODE -ne 0) { throw "the cleanup failed with $LASTEXITCODE" }
            & $binary clean --project --yes
            if ($LASTEXITCODE -ne 0) { throw "the cleanup of the scope failed with $LASTEXITCODE" }
            $left = @(Get-ChildItem -Path $work -Recurse -File).Count
            if ($left -ne 0) { throw "the cleanup left $left file(s) behind" }
          }
          finally {
            Pop-Location
            Remove-Item -Path $work -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Run the Windows-covered tests
        shell: pwsh
        run: |
          go test ./internal/lockfile/... ./internal/proc/... ./internal/cli/...
